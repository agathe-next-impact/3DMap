<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Hermitage et la For&ecirc;t - Carte 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #87CEEB; font-family: 'Comic Sans MS', 'Chalkboard SE', cursive; }
        canvas { display: block; }
        #title {
            position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
            font-size: 2.2em; color: #2a1a00;
            text-shadow: 3px 3px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 3px 0 #fff, 3px 0 0 #fff;
            pointer-events: none; z-index: 10; text-align: center; line-height: 1.15;
            letter-spacing: 1px;
        }
        #controls {
            position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
            color: #2a1a00; background: rgba(255,255,255,0.88); padding: 7px 18px;
            border-radius: 20px; font-size: 0.85em; pointer-events: none; z-index: 10;
            border: 2.5px solid #2a1a00;
        }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            font-size: 1.5em; color: #2a1a00; z-index: 20;
            background: #fff; padding: 20px 40px; border-radius: 22px; border: 3px solid #2a1a00;
        }
        #tooltip {
            position: absolute; display: none; background: #fff; color: #2a1a00;
            padding: 6px 14px; border-radius: 14px; border: 2.5px solid #2a1a00;
            font-size: 0.95em; pointer-events: none; z-index: 15;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.15);
        }
        #panoramax-btn {
            position: absolute; top: 18px; right: 18px; z-index: 10;
            background: #fff; color: #2a1a00; border: 2.5px solid #2a1a00;
            padding: 8px 16px; border-radius: 16px; cursor: pointer;
            font-family: 'Comic Sans MS', cursive; font-size: 0.9em;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.15);
            transition: background 0.2s;
        }
        #panoramax-btn:hover { background: #f0e8d0; }
        #panoramax-btn.active { background: #5dbd3a; color: #fff; border-color: #3a8a1a; }
        #panoramax-status {
            position: absolute; top: 60px; right: 18px; z-index: 10;
            background: rgba(255,255,255,0.92); color: #2a1a00;
            padding: 6px 14px; border-radius: 12px; border: 2px solid #2a1a00;
            font-family: 'Comic Sans MS', cursive; font-size: 0.8em;
            display: none;
        }
        #photo-viewer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 100; display: none;
            justify-content: center; align-items: center; flex-direction: column;
            cursor: pointer;
        }
        #photo-viewer img {
            max-width: 90%; max-height: 80%; border-radius: 12px;
            border: 4px solid #fff; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        #photo-viewer .caption {
            color: #fff; font-family: 'Comic Sans MS', cursive;
            margin-top: 12px; font-size: 1em; text-align: center;
        }
        #photo-viewer .close-hint {
            color: rgba(255,255,255,0.6); font-family: 'Comic Sans MS', cursive;
            margin-top: 8px; font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div id="title">L'Hermitage<br>et la For&ecirc;t</div>
    <div id="controls">Clic gauche: tourner | Molette: zoom | Clic droit: d&eacute;placer</div>
    <div id="loading">Chargement de la carte...</div>
    <div id="tooltip"></div>
    <button id="panoramax-btn" title="Afficher les photos Panoramax">Photos</button>
    <div id="panoramax-status"></div>
    <div id="photo-viewer" onclick="this.style.display='none'">
        <img id="photo-viewer-img" src="" alt="">
        <div class="caption" id="photo-viewer-caption"></div>
        <div class="close-hint">Cliquer pour fermer</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    // ═══════════════════════════════════════════
    // BD-style outline shader (Sobel edge detect)
    // ═══════════════════════════════════════════
    const OutlineShader = {
        uniforms: {
            tDiffuse: { value: null },
            resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            outlineColor: { value: new THREE.Vector3(0.12, 0.08, 0.0) },
            thickness: { value: 1.4 },
        },
        vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform vec2 resolution;
            uniform vec3 outlineColor;
            uniform float thickness;
            varying vec2 vUv;

            float luminance(vec4 c){ return dot(c.rgb, vec3(0.299,0.587,0.114)); }

            void main(){
                vec2 texel = thickness / resolution;
                float tl = luminance(texture2D(tDiffuse, vUv + vec2(-texel.x, texel.y)));
                float t  = luminance(texture2D(tDiffuse, vUv + vec2(0.0, texel.y)));
                float tr = luminance(texture2D(tDiffuse, vUv + vec2(texel.x, texel.y)));
                float l  = luminance(texture2D(tDiffuse, vUv + vec2(-texel.x, 0.0)));
                float r  = luminance(texture2D(tDiffuse, vUv + vec2(texel.x, 0.0)));
                float bl = luminance(texture2D(tDiffuse, vUv + vec2(-texel.x,-texel.y)));
                float b  = luminance(texture2D(tDiffuse, vUv + vec2(0.0,-texel.y)));
                float br = luminance(texture2D(tDiffuse, vUv + vec2(texel.x,-texel.y)));

                float gx = tl + 2.0*l + bl - tr - 2.0*r - br;
                float gy = tl + 2.0*t + tr - bl - 2.0*b - br;
                float edge = sqrt(gx*gx + gy*gy);

                float strength = smoothstep(0.05, 0.25, edge);
                vec4 color = texture2D(tDiffuse, vUv);
                gl_FragColor = vec4(mix(color.rgb, outlineColor, strength * 0.92), color.a);
            }
        `
    };

    // ═══════════════════════════════════════════
    // KML GPS Data
    // ═══════════════════════════════════════════
    const KML_PLACES = [
        { name: "Les jardins de l'Hermitage", lon: 3.1283726759185826, lat: 49.435474936916904, type: "garden" },
        { name: "Les ateliers", lon: 3.1288569554447894, lat: 49.437065074302836, type: "workshop" },
        { name: "La grande maison", lon: 3.1296145775339532, lat: 49.43767351636242, type: "grande_maison" },
        { name: "Les tipis et cabanons", lon: 3.127584150334995, lat: 49.43836816567958, type: "tipis" },
        { name: "La m\u00e8re mitage", lon: 3.129701704074207, lat: 49.4380282321367, type: "mere_mitage" },
        { name: "Le plateau", lon: 3.1267507660369147, lat: 49.43760454355285, type: "plateau" },
        { name: "La maison dans la for\u00eat", lon: 3.127281101499329, lat: 49.43692220017425, type: "forest_house" },
    ];

    const CL = 3.12825, CA = 49.43695, ML = 72430, MA = 111000, SC = 0.22;
    function gps(lon, lat) { return { x: (lon-CL)*ML*SC, z: -(lat-CA)*MA*SC }; }
    KML_PLACES.forEach(p => { const c = gps(p.lon, p.lat); p.x = c.x; p.z = c.z; });

    // ═══════════════════════════════════════════
    // Scene
    // ═══════════════════════════════════════════
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd4eef7);
    scene.fog = new THREE.FogExp2(0xd4eef7, 0.004);

    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
    camera.position.set(10, 65, 75);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.NoToneMapping;
    document.body.appendChild(renderer.domElement);

    // Post-processing: BD outlines
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const outlinePass = new ShaderPass(OutlineShader);
    composer.addPass(outlinePass);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(5, 0, -5);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.minDistance = 15;
    controls.maxDistance = 160;

    // ═══════════════════════════════════════════
    // Lighting (bright, flat BD style)
    // ═══════════════════════════════════════════
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));

    const sun = new THREE.DirectionalLight(0xfff5e0, 1.2);
    sun.position.set(25, 45, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -85; sun.shadow.camera.right = 85;
    sun.shadow.camera.top = 85; sun.shadow.camera.bottom = -85;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xc0d8ff, 0.5);
    fill.position.set(-20, 30, -20);
    scene.add(fill);

    // ═══════════════════════════════════════════
    // Toon gradient (2 steps = flat BD shading)
    // ═══════════════════════════════════════════
    const toonTex = (() => {
        const c = document.createElement('canvas');
        c.width = 4; c.height = 1;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#888'; ctx.fillRect(0,0,2,1);
        ctx.fillStyle = '#fff'; ctx.fillRect(2,0,2,1);
        const t = new THREE.CanvasTexture(c);
        t.minFilter = THREE.NearestFilter;
        t.magFilter = THREE.NearestFilter;
        return t;
    })();

    function toon(color) {
        return new THREE.MeshToonMaterial({ color, gradientMap: toonTex });
    }

    // BD palette - bright saturated colors
    const M = {
        grass1: toon(0x5dbd3a), grass2: toon(0x3a9a22), grass3: toon(0x7dd55a),
        trunk: toon(0x7a4a20), leaf: toon(0x2eaa2e), darkLeaf: toon(0x1a7a1a), lightLeaf: toon(0x55cc44),
        roofRed: toon(0xe83030), roofBlue: toon(0x3388cc), roofBrown: toon(0xa06820),
        wall: toon(0xfff4d4), wallPink: toon(0xffd4cc), wallBeige: toon(0xf0ddb8),
        stone: toon(0xb0a090), fence: toon(0xe0c488), path: toon(0xe0c070), road: toon(0xd4c8a0),
        water: toon(0x44aadd), canvas: toon(0xf8ecd0), doorBrown: toon(0x5a3010),
        white: toon(0xffffff),
        stoneWall: toon(0xd4c8a0), timber: toon(0x6b4226), timberFill: toon(0xdaa050),
        roofTile: toon(0x9a5e30), metalRoof: toon(0x8a8a88),
    };
    M.water.transparent = true; M.water.opacity = 0.88;

    // ═══════════════════════════════════════════
    // Terrain height
    // ═══════════════════════════════════════════
    const PL = KML_PLACES.find(p=>p.type==='plateau');
    const FH = KML_PLACES.find(p=>p.type==='forest_house');
    const FCX = (PL.x+FH.x)/2, FCZ = (PL.z+FH.z)/2;
    const GM = KML_PLACES.find(p=>p.type==='grande_maison');
    const JA = KML_PLACES.find(p=>p.type==='garden');
    const TI = KML_PLACES.find(p=>p.type==='tipis');
    const AT = KML_PLACES.find(p=>p.type==='workshop');
    const ME = KML_PLACES.find(p=>p.type==='mere_mitage');
    const rowAngle = Math.atan2(ME.x-AT.x, -(ME.z-AT.z));

    function terrH(x, z) {
        let y = 0;
        // Gentle hill rising toward the northwest (the "colline" from WW1)
        y += Math.max(0, 5 - Math.sqrt((x+15)**2 + (z+15)**2)*0.06) * 1.2;
        // Plateau area - elevated flat zone to the west
        const pd = Math.sqrt((x-PL.x)**2 + (z-PL.z)**2);
        y += Math.max(0, 6 - pd*0.12) * 0.8;
        // Western forest ridge
        const fd = Math.sqrt((x-FCX)**2 + (z-FCZ)**2);
        y += Math.max(0, 5 - fd*0.1) * (0.6 + 0.2*Math.cos(fd*0.08));
        // Northern tipis area - slight rise
        const rd = Math.abs(z-TI.z)*0.5 + Math.abs(x-TI.x)*0.3;
        y += Math.max(0, 2.5 - rd*0.08);
        // Gardens depression (southern, lower ground)
        const jd = Math.sqrt((x-JA.x)**2 + (z-JA.z)**2);
        if (jd < 15) y -= (15-jd)*0.12;
        // Gentle undulation
        y += Math.sin(x*0.04)*Math.cos(z*0.035)*2.2;
        y += Math.sin(x*0.09+1)*Math.cos(z*0.07+2)*0.8;
        y += Math.sin(x*0.17+3)*Math.cos(z*0.14+1)*0.3;
        // Smooth area near grande maison
        const vd = Math.sqrt((x-GM.x)**2 + (z-GM.z)**2);
        if (vd < 20) { const f=Math.max(0,1-vd/20); y *= (1-f*0.4); y += f*2.5; }
        // General slope: south is lower, north is higher
        y += (-z * 0.015);
        return y + 2;
    }

    // ═══════════════════════════════════════════
    // Zone classification (aerial view realism)
    // ═══════════════════════════════════════════
    function isForestZone(x, z) {
        // Tipis clearing (small island in the forest, visible as domes in aerial)
        if (Math.sqrt((x-TI.x)**2 + (z-TI.z)**2) < 10) return false;
        // Forest comes VERY close to buildings on the west side
        // The building row runs from AT(~10,-3) to ME(~23,-26)
        let westEdge;
        if (z > 20) {
            // South meadow: forest edge a bit further west
            westEdge = 0 + Math.sin(z * 0.07) * 4;
        } else if (z > 0) {
            // Transition: forest closing in toward buildings
            westEdge = 4 + (20 - z) * 0.15 + Math.sin(z * 0.12) * 2;
        } else if (z > -28) {
            // Near buildings: forest RIGHT next to building row (~5 units west)
            westEdge = 7 + Math.sin(z * 0.15) * 2;
        } else {
            // North: almost entirely forest
            westEdge = 14 + Math.sin(z * 0.1) * 3;
        }
        if (x < westEdge) return true;
        // Northern forest closes in aggressively
        const northEdge = -28 + Math.sin(x * 0.12) * 3;
        if (z < northEdge && x < 20) return true;
        // Southwest forest
        if (z > 35 && x < 2) return true;
        // Everything far from clearing center
        const dist = Math.sqrt((x-18)**2 + (z-2)**2);
        if (dist > 52) return true;
        return false;
    }
    function isFieldZone(x, z) {
        // Agricultural fields to the east
        if (x > 28 && z > -25 && z < 30) return true;
        // Southern fields (below gardens, east side)
        if (z > 32 && x > 8) return true;
        return false;
    }

    // ═══════════════════════════════════════════
    // Terrain mesh (smooth, rounded)
    // ═══════════════════════════════════════════
    (() => {
        const S = 180, R = 200;
        const geo = new THREE.PlaneGeometry(S, S, R, R);
        geo.rotateX(-Math.PI/2);
        const pos = geo.attributes.position;
        for (let i=0; i<pos.count; i++) pos.setY(i, terrH(pos.getX(i), pos.getZ(i)));
        geo.computeVertexNormals();
        const cols = new Float32Array(pos.count*3);
        for (let i=0; i<pos.count; i++) {
            const x=pos.getX(i), z=pos.getZ(i);
            const nearJard = Math.sqrt((x-JA.x)**2+(z-JA.z)**2)<10;
            let r,g,b;
            // Check if near the road (runs between GM and long building)
            const nearRoad = (() => {
                // Road follows AT→ME line offset 3.5 units west (perpendicular)
                const t = Math.max(0, Math.min(1, ((x-AT.x)*(ME.x-AT.x)+(z-AT.z)*(ME.z-AT.z)) /
                    ((ME.x-AT.x)**2+(ME.z-AT.z)**2)));
                const rx = AT.x + (ME.x-AT.x)*t - Math.cos(rowAngle)*3.5;
                const rz = AT.z + (ME.z-AT.z)*t + Math.sin(rowAngle)*3.5;
                return Math.sqrt((x-rx)**2+(z-rz)**2) < 3 && z > ME.z-10 && z < AT.z+15;
            })();
            if (isForestZone(x, z)) {
                // Dark forest floor - brown-green, leaf litter
                r=0.14+Math.random()*0.05; g=0.28+Math.random()*0.07; b=0.09+Math.random()*0.04;
            } else if (nearRoad) {
                // Gravel/dirt road surface - light gray-brown
                r=0.58+Math.random()*0.06; g=0.54+Math.random()*0.05; b=0.44+Math.random()*0.05;
            } else if (isFieldZone(x, z)) {
                // Agricultural fields - lighter yellow-green with plowed rows
                const row = Math.sin(x*0.4+z*0.2)*0.5+0.5;
                r=0.42+row*0.08+Math.random()*0.04; g=0.52+row*0.06+Math.random()*0.06; b=0.18+Math.random()*0.04;
            } else if (nearJard) {
                // Garden area - rich cultivated green
                r=0.28+Math.random()*0.04; g=0.62+Math.random()*0.1; b=0.20+Math.random()*0.04;
            } else {
                // Clearing meadow - bright green (vivid in aerial)
                r=0.30+Math.random()*0.05; g=0.58+Math.random()*0.12; b=0.20+Math.random()*0.05;
            }
            cols[i*3]=r; cols[i*3+1]=g; cols[i*3+2]=b;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(cols,3));
        const m = new THREE.Mesh(geo, new THREE.MeshToonMaterial({ vertexColors:true, gradientMap:toonTex }));
        m.receiveShadow = true;
        scene.add(m);
    })();

    // ═══════════════════════════════════════════
    // BD-style Cartoon Tree (very round, blobby)
    // ═══════════════════════════════════════════
    function mkTree(x, z, h, type='round') {
        const g = new THREE.Group(), ty = terrH(x,z);
        // Round chunky trunk
        const th = h*0.35;
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(h*0.09, h*0.13, th, 12), M.trunk);
        trunk.position.y = th/2; trunk.castShadow = true;
        g.add(trunk);

        if (type === 'round') {
            const lr = h*0.42;
            const mats = [M.leaf, M.darkLeaf, M.lightLeaf];
            // Main blob - very round
            const main = new THREE.Mesh(new THREE.SphereGeometry(lr, 16, 12), mats[Math.floor(Math.random()*3)]);
            main.position.y = th + lr*0.55;
            main.scale.set(1, 0.82, 1);
            main.castShadow = true;
            g.add(main);
            // Extra blobs for organic BD look
            for (let i=0; i<4; i++) {
                const a = (i/4)*Math.PI*2 + Math.random()*0.8;
                const br = lr*(0.45+Math.random()*0.15);
                const blob = new THREE.Mesh(new THREE.SphereGeometry(br, 12, 10), mats[Math.floor(Math.random()*3)]);
                blob.position.set(Math.cos(a)*lr*0.55, th+lr*0.2+Math.random()*lr*0.3, Math.sin(a)*lr*0.55);
                blob.castShadow = true;
                g.add(blob);
            }
        } else {
            // Pine - rounded cones
            for (let j=0; j<3; j++) {
                const cr = h*(0.38-j*0.08), ch = h*0.32;
                const cone = new THREE.Mesh(new THREE.ConeGeometry(cr, ch, 12), M.darkLeaf);
                cone.position.y = th + j*ch*0.5 + ch*0.3;
                cone.castShadow = true;
                g.add(cone);
            }
        }
        g.position.set(x, ty, z);
        g.rotation.y = Math.random()*Math.PI*2;
        g.rotation.x = (Math.random()-0.5)*0.05;
        g.rotation.z = (Math.random()-0.5)*0.05;
        return g;
    }

    // ═══════════════════════════════════════════
    // BD-style rounded house
    // ═══════════════════════════════════════════
    function mkHouse(x, z, opts={}) {
        const g = new THREE.Group(), ty = terrH(x,z);
        const w=opts.w||3, h=opts.h||2.5, d=opts.d||3;
        const rm=opts.roof||M.roofRed, wm=opts.wall||M.wall;

        // Rounded walls (capsule-like using cylinder + spheres)
        const walls = new THREE.Mesh(new THREE.BoxGeometry(w, h, d, 4, 4, 4), wm);
        walls.position.y = h/2; walls.castShadow = true; walls.receiveShadow = true;
        // Round the edges by modifying vertices
        const wp = walls.geometry.attributes.position;
        const bevel = 0.35;
        for (let i=0; i<wp.count; i++) {
            const vx=wp.getX(i), vy=wp.getY(i), vz=wp.getZ(i);
            const hw=w/2, hh=h/2, hd=d/2;
            const dx = Math.max(0, Math.abs(vx)-hw+bevel);
            const dy = Math.max(0, Math.abs(vy)-hh+bevel);
            const dz = Math.max(0, Math.abs(vz)-hd+bevel);
            const dist = Math.sqrt(dx*dx+dy*dy+dz*dz);
            if (dist > 0) {
                const factor = bevel / Math.max(dist, 0.001);
                if (factor < 1) {
                    wp.setX(i, Math.sign(vx) * Math.min(Math.abs(vx), hw-bevel+bevel*Math.abs(vx)/(Math.abs(vx)+0.001)*factor));
                }
            }
        }
        walls.geometry.computeVertexNormals();
        g.add(walls);

        // Rounded roof (big hemisphere on top)
        const roofR = Math.max(w,d)*0.6;
        const roofH = h*0.55;
        const roof = new THREE.Mesh(new THREE.SphereGeometry(roofR, 16, 10, 0, Math.PI*2, 0, Math.PI*0.55), rm);
        roof.position.y = h + roofH*0.15;
        roof.scale.y = roofH/roofR;
        roof.castShadow = true;
        g.add(roof);

        // Round door
        const door = new THREE.Mesh(new THREE.CapsuleGeometry(w*0.12, h*0.25, 8, 8), M.doorBrown);
        door.position.set(0, h*0.25, d/2+0.05);
        g.add(door);

        // Round windows
        [-1, 1].forEach(s => {
            const win = new THREE.Mesh(new THREE.CircleGeometry(w*0.1, 16), toon(0x88ccff));
            win.position.set(s*w*0.3, h*0.55, d/2+0.06);
            g.add(win);
            // Window frame
            const frame = new THREE.Mesh(new THREE.TorusGeometry(w*0.1, 0.04, 8, 16), M.wall);
            frame.position.set(s*w*0.3, h*0.55, d/2+0.07);
            g.add(frame);
        });

        // Rounded chimney
        if (opts.chimney !== false) {
            const ch = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 1.6, 10), M.stone);
            ch.position.set(w*0.2, h+roofH*0.6, 0);
            ch.castShadow = true;
            g.add(ch);
            // Chimney cap
            const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.15, 10), M.stone);
            cap.position.set(w*0.2, h+roofH*0.6+0.85, 0);
            g.add(cap);
        }

        g.position.set(x, ty, z);
        g.rotation.y = opts.rot || 0;
        return g;
    }

    // ═══════════════════════════════════════════
    // Path (rounded segments using capsules)
    // ═══════════════════════════════════════════
    function mkPath(pts, w, mat) {
        const g = new THREE.Group();
        for (let i=0; i<pts.length-1; i++) {
            const [x1,z1]=pts[i], [x2,z2]=pts[i+1];
            const dx=x2-x1, dz=z2-z1, len=Math.sqrt(dx*dx+dz*dz);
            const mx=(x1+x2)/2, mz=(z1+z2)/2, my=terrH(mx,mz)+0.08;
            const seg2 = new THREE.Mesh(new THREE.BoxGeometry(len, 0.15, w), mat);
            seg2.position.set(mx, my, mz);
            seg2.rotation.y = -Math.atan2(dz, dx);
            seg2.receiveShadow = true;
            g.add(seg2);
        }
        return g;
    }

    // ═══════════════════════════════════════════
    // Text sprite (BD comic font style)
    // ═══════════════════════════════════════════
    function mkLabel(text, x, y, z, size, color) {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        c.width = 512; c.height = 128;
        ctx.font = `bold ${Math.floor(size*28)}px "Comic Sans MS", cursive`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        // Bold outline for BD style
        ctx.strokeStyle = '#1a1000'; ctx.lineWidth = 6; ctx.lineJoin = 'round';
        ctx.strokeText(text, 256, 64);
        ctx.fillStyle = '#fff'; ctx.fillText(text, 256, 64);
        // Inner color
        ctx.fillStyle = color || '#2a1a00'; ctx.font = `bold ${Math.floor(size*27)}px "Comic Sans MS", cursive`;
        ctx.fillText(text, 256, 64);

        const t = new THREE.CanvasTexture(c); t.minFilter = THREE.LinearFilter;
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true }));
        s.position.set(x, y, z); s.scale.set(size*8, size*2, 1);
        return s;
    }

    // ═══════════════════════════════════════════
    // Pin markers (round, bouncy)

    function mkPin(x, z, color) {
        const g = new THREE.Group(), ty = terrH(x,z);

    // ═══════════════════════════════════════════
    // BD-style Flower (round petals)
    // ═══════════════════════════════════════════
    const flowerCols = [0xff5588, 0xffaa33, 0xff5555, 0xdd88dd, 0xffdd00, 0xff66aa, 0x66bbee];
    function mkFlower(x, z) {
        const g = new THREE.Group(), ty = terrH(x,z);
        const col = flowerCols[Math.floor(Math.random()*flowerCols.length)];
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.4, 6), toon(0x22aa22));
        stem.position.y = 0.2; g.add(stem);

    // ═══════════════════════════════════════════
    // Unique landmarks (BD rounded style)
    // ═══════════════════════════════════════════

    // Jardins
    function mkGarden(p) {
        const g = new THREE.Group(), ty = terrH(p.x, p.z);
        for (let row=-2; row<=2; row++) {
            for (let col=-2; col<=2; col++) {
                const bed = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.75, 0.25, 12), toon(0x6b4226));
                bed.position.set(col*2, 0.12, row*1.7); bed.castShadow=true; g.add(bed);
                const n = 3+Math.floor(Math.random()*3);
                for (let f=0; f<n; f++) {
                    const fc = flowerCols[Math.floor(Math.random()*flowerCols.length)];
                    const fl = new THREE.Mesh(new THREE.SphereGeometry(0.15+Math.random()*0.1, 10, 8), toon(fc));
                    fl.position.set(col*2+(Math.random()-0.5)*1, 0.35+Math.random()*0.25, row*1.7+(Math.random()-0.5)*0.8);
                    fl.castShadow=true; g.add(fl);
                }
            }
        }
        // Round stone wall
        const wallR = 6;
        for (let a=0; a<Math.PI*2; a+=0.3) {
            const rock = new THREE.Mesh(new THREE.SphereGeometry(0.3+Math.random()*0.15, 8, 6), M.stone);
            rock.position.set(Math.cos(a)*wallR, 0.2, Math.sin(a)*wallR);
            rock.scale.y = 0.6; g.add(rock);
        }
        // Round gate
        const gate = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.12, 8, 16, Math.PI), toon(0x228B22));
        gate.position.set(0, 0.8, -wallR); g.add(gate);
        g.position.set(p.x, ty, p.z);
        return g;
    }

    // Grande maison (manoir en pierre, toit à pignon, colombages)
    function mkGrandeMaison(p) {
        const g = new THREE.Group(), ty = terrH(p.x, p.z);
        const W = 7.5, H = 6, D = 5.5; // wider, taller to match real proportions
        const FZ = D/2; // front face z

        // ── Stone walls (main body, 2.5 stories) ──
        const walls = new THREE.Mesh(new THREE.BoxGeometry(W, H, D, 4, 4, 4), M.stoneWall);
        walls.position.y = H/2; walls.castShadow = true; walls.receiveShadow = true;
        g.add(walls);
        // Stone line detail (horizontal band between floors)
        [2.2, 4.2].forEach(ly => {
            const band = new THREE.Mesh(new THREE.BoxGeometry(W+0.1, 0.12, D+0.1), M.stone);
            band.position.y = ly; g.add(band);
        });

        // ── Steep gable roof (triangular prism, brown tiles) ──
        const rW = W/2 + 0.5, rH = 4;
        const rShape = new THREE.Shape();
        rShape.moveTo(-rW, 0); rShape.lineTo(0, rH); rShape.lineTo(rW, 0); rShape.closePath();
        const rGeo = new THREE.ExtrudeGeometry(rShape, {
            depth: D + 0.8, bevelEnabled: true, bevelThickness: 0.15, bevelSize: 0.12, bevelSegments: 3
        });
        rGeo.translate(0, 0, -(D + 0.8)/2);
        const roof = new THREE.Mesh(rGeo, M.roofTile);
        roof.position.y = H; roof.castShadow = true;
        g.add(roof);

        // ── Front gable: colombages (half-timbered) ──
        // Background fill panel (warm orange/yellow)
        const gShape = new THREE.Shape();
        const gInset = 0.15;
        gShape.moveTo(-(rW-gInset)*0.88, gInset);
        gShape.lineTo(0, rH-gInset*2);
        gShape.lineTo((rW-gInset)*0.88, gInset);
        gShape.closePath();
        const gPanel = new THREE.Mesh(new THREE.ShapeGeometry(gShape), M.timberFill);
        gPanel.position.set(0, H, FZ + 0.06);
        g.add(gPanel);
        // Timber beams on gable
        const beamMat = M.timber;
        // Central vertical
        const cv = new THREE.Mesh(new THREE.BoxGeometry(0.18, rH*0.85, 0.12), beamMat);
        cv.position.set(0, H + rH*0.43, FZ + 0.1); g.add(cv);
        // Horizontal beam
        const hb = new THREE.Mesh(new THREE.BoxGeometry(rW*1.3, 0.15, 0.12), beamMat);
        hb.position.set(0, H + rH*0.33, FZ + 0.1); g.add(hb);
        // Diagonal cross beams (X pattern)
        [-1, 1].forEach(s => {
            const dLen = rH * 0.52;
            const diag = new THREE.Mesh(new THREE.BoxGeometry(0.12, dLen, 0.12), beamMat);
            diag.position.set(s * rW*0.22, H + rH*0.5, FZ + 0.1);
            diag.rotation.z = s * 0.5;
            g.add(diag);
            // Lower X
            const diag2 = new THREE.Mesh(new THREE.BoxGeometry(0.12, dLen*0.6, 0.12), beamMat);
            diag2.position.set(s * rW*0.35, H + rH*0.2, FZ + 0.1);
            diag2.rotation.z = -s * 0.4;
            g.add(diag2);
        });
        // Outline beams (left and right gable edges)
        [-1, 1].forEach(s => {
            const edgeLen = Math.sqrt(rW*rW + rH*rH)*0.92;
            const edge = new THREE.Mesh(new THREE.BoxGeometry(0.14, edgeLen, 0.12), beamMat);
            edge.position.set(s * rW*0.44, H + rH*0.45, FZ + 0.1);
            edge.rotation.z = s * Math.atan2(rW, rH);
            g.add(edge);
        });
        // Bottom beam of gable
        const bb = new THREE.Mesh(new THREE.BoxGeometry(rW*1.8, 0.18, 0.12), beamMat);
        bb.position.set(0, H + 0.02, FZ + 0.1); g.add(bb);

        // Attic window in gable (small rounded)
        const atticWin = new THREE.Mesh(new THREE.CircleGeometry(0.4, 14), toon(0x88ccff));
        atticWin.position.set(0, H + rH*0.55, FZ + 0.13); g.add(atticWin);
        const atticFrame = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.06, 6, 14), beamMat);
        atticFrame.position.set(0, H + rH*0.55, FZ + 0.14); g.add(atticFrame);

        // ── Windows (rectangular with stone frames, 2 rows) ──
        // 1st floor
        [-2.4, -0.9, 0.9, 2.4].forEach(wx => {
            const win = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 1.1), toon(0x88ccff));
            win.position.set(wx, 1.8, FZ + 0.06); g.add(win);
            // Stone frame around window
            const fT = 0.08;
            const fW = 0.9, fH = 1.25;
            [[-fW/2,0,fT,fH],[fW/2,0,fT,fH],[0,fH/2,fW,fT],[0,-fH/2,fW,fT]].forEach(([fx,fy,fw,fh]) => {
                const fr = new THREE.Mesh(new THREE.BoxGeometry(fw, fh, 0.08), M.stone);
                fr.position.set(wx+fx, 1.8+fy, FZ + 0.07); g.add(fr);
            });
        });
        // 2nd floor
        [-2.4, -0.9, 0.9, 2.4].forEach(wx => {
            const win = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 1.1), toon(0x88ccff));
            win.position.set(wx, 4.1, FZ + 0.06); g.add(win);
            const fW = 0.9, fH = 1.25, fT = 0.08;
            [[-fW/2,0,fT,fH],[fW/2,0,fT,fH],[0,fH/2,fW,fT],[0,-fH/2,fW,fT]].forEach(([fx,fy,fw,fh]) => {
                const fr = new THREE.Mesh(new THREE.BoxGeometry(fw, fh, 0.08), M.stone);
                fr.position.set(wx+fx, 4.1+fy, FZ + 0.07); g.add(fr);
            });
        });

        // ── Balcony with stone balustrade (2nd floor) ──
        const balW = 4.5, balD = 1.3;
        const balFloor = new THREE.Mesh(new THREE.BoxGeometry(balW, 0.18, balD), M.stone);
        balFloor.position.set(0, 3.4, FZ + balD/2); balFloor.castShadow = true; g.add(balFloor);
        // Balustrade rail
        const rail = new THREE.Mesh(new THREE.BoxGeometry(balW, 0.14, 0.14), M.stone);
        rail.position.set(0, 4.05, FZ + balD - 0.07); g.add(rail);
        const railBot = new THREE.Mesh(new THREE.BoxGeometry(balW, 0.1, 0.14), M.stone);
        railBot.position.set(0, 3.55, FZ + balD - 0.07); g.add(railBot);
        // Balusters
        for (let i = -5; i <= 5; i++) {
            const bal = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.5, 6), M.stoneWall);
            bal.position.set(i * 0.4, 3.78, FZ + balD - 0.07); g.add(bal);
        }
        // Side pillars
        [-balW/2, balW/2].forEach(sx => {
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), M.stone);
            pillar.position.set(sx, 3.78, FZ + balD - 0.07); g.add(pillar);
        });

        // ── Main door (front, arched) ──
        const door = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1.2, 10, 10), M.doorBrown);
        door.position.set(0, 1.1, FZ + 0.06); g.add(door);
        // Stone arch above door
        const arch = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.12, 8, 14, Math.PI), M.stone);
        arch.position.set(0, 2.05, FZ + 0.08); g.add(arch);

        // ── Chimneys (3, like the photo) ──
        [[-2.5, -0.8], [2.8, 0.5], [0, -D/2+0.5]].forEach(([cx, cz]) => {
            const ch = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.38, 2.8, 10), M.stone);
            ch.position.set(cx, H + rH - 0.8, cz); ch.castShadow = true; g.add(ch);
            const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.18, 10), M.stone);
            cap.position.set(cx, H + rH + 0.55, cz); g.add(cap);
        });

        // ── Left annexe (lighter, simpler) ──
        const aX = -(W/2 + 2.2), aW = 4, aH = 3.8, aD = D - 0.8;
        const annexW = new THREE.Mesh(new THREE.BoxGeometry(aW, aH, aD, 3, 3, 3), toon(0xddd8cc));
        annexW.position.set(aX, aH/2, 0); annexW.castShadow = true; g.add(annexW);
        // Annexe shed roof (simpler, lower slope)
        const aRW = aW/2 + 0.3, aRH = 1.5;
        const aRS = new THREE.Shape();
        aRS.moveTo(-aRW, 0); aRS.lineTo(0, aRH); aRS.lineTo(aRW, 0); aRS.closePath();
        const aRGeo = new THREE.ExtrudeGeometry(aRS, {
            depth: aD + 0.4, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.08, bevelSegments: 2
        });
        aRGeo.translate(0, 0, -(aD + 0.4)/2);
        const annexRoof = new THREE.Mesh(aRGeo, M.metalRoof);
        annexRoof.position.set(aX, aH, 0); annexRoof.castShadow = true; g.add(annexRoof);
        // Annexe windows
        [-1, 0.8].forEach(wx => {
            const win = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.8), toon(0x88ccff));
            win.position.set(aX + wx, 2.2, aD/2 + 0.06); g.add(win);
        });
        // Annexe door
        const aDoor = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1.6), toon(0x888888));
        aDoor.position.set(aX - 0.5, 0.8, aD/2 + 0.06); g.add(aDoor);

        // ── Stone steps at main entrance ──
        for (let s = 0; s < 3; s++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(2.2 - s*0.15, 0.18, 0.5), M.stone);
            step.position.set(0, s * 0.18, FZ + 0.5 + s * 0.5); step.receiveShadow = true; g.add(step);
        }

        // ── Side windows (visible from angle) ──
        [-1.5, 0, 1.5].forEach(wz => {
            [1.8, 4.1].forEach(wy => {
                const win = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 1.0), toon(0x88ccff));
                win.position.set(W/2 + 0.06, wy, wz); win.rotation.y = Math.PI/2; g.add(win);
            });
        });

        g.position.set(p.x, ty, p.z); g.rotation.y = -0.2 - Math.PI/4;
        return g;
    }

    // Tipis et cabanons — white domes/yurts (visible as white circles in aerial)
    function mkTipis(p) {
        const g = new THREE.Group(), ty = terrH(p.x, p.z);
        const domeMat = toon(0xf0ece0); // white/off-white canvas
        const baseRing = toon(0xd8d0c0);
        // 5 white dome structures scattered in a clearing
        [[0,0],[3.5,2.5],[-2.5,3.5],[4.5,-2],[-3.5,-1.5]].forEach(([dx, dz]) => {
            const dg = new THREE.Group();

            const base = new THREE.Mesh(new THREE.CylinderGeometry(r, r+0.05, 1.2, 20), domeMat);

            const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.06, 8, 20), baseRing);

            // Dome top (hemisphere)
            const dome = new THREE.Mesh(
                new THREE.SphereGeometry(r, 20, 12, 0, Math.PI*2, 0, Math.PI*0.5),

            );

            dg.position.set(dx, 0, dz);
            dg.rotation.y = Math.random() * Math.PI * 2;

        cw.position.y = 0.9; cw.castShadow = true; cab.add(cw);
        const cr = new THREE.Mesh(new THREE.SphereGeometry(1.3, 14, 10, 0, Math.PI*2, 0, Math.PI*0.45), toon(0x654321));

        fire.position.set(0, 0.1, 1.8); fire.rotation.x = -Math.PI/2; g.add(fire);
        const glow = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8), toon(0xff6600));
        glow.position.set(0, 0.3, 1.8); g.add(glow);
        g.position.set(p.x, ty, p.z);
        return g;

    // Mere mitage (round cottage)
    function mkMereMitage(p) {
        const g = new THREE.Group(), ty = terrH(p.x, p.z);
        // Round cottage body

        const roof = new THREE.Mesh(new THREE.SphereGeometry(3, 18, 12, 0, Math.PI*2, 0, Math.PI*0.45), toon(0xb8860b));

        // Round door
        const door = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.8, 10, 10), toon(0x880000));
        door.position.set(0, 0.8, 2.3); g.add(door);
        // Big round windows
        [-1.2, 1.2].forEach(wx => {
            const win = new THREE.Mesh(new THREE.CircleGeometry(0.35, 14), toon(0xffdd44));
            win.position.set(wx, 2, 2.15); g.add(win);
            const frame = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.05, 6, 14), M.wallPink);
            frame.position.set(wx, 2, 2.17); g.add(frame);
        });
        // Round chimney
        const ch = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 1.4, 10), toon(0x8b7355));
        ch.position.set(1.2, 3.8, 0); ch.castShadow=true; g.add(ch);
        // Flower boxes (round)
        [-1.2, 1.2].forEach(wx => {
            const box = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.3, 0.25, 10), toon(0x654321));
            box.position.set(wx, 1.3, 2.4); g.add(box);
            for (let f=0; f<3; f++) {
                const fl = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6), toon(flowerCols[Math.floor(Math.random()*flowerCols.length)]));
                fl.position.set(wx+(f-1)*0.18, 1.5, 2.4); g.add(fl);

        // Round fence
        for (let a=0; a<Math.PI*2; a+=0.5) {

            post.position.set(Math.cos(a)*3.8, 0.35, Math.sin(a)*3.8); g.add(post);
        }
        g.position.set(p.x, ty, p.z); g.rotation.y = 0.4;
        return g;

    // Plateau (round clearing)
    function mkPlateau(p) {
        const g = new THREE.Group(), ty = terrH(p.x, p.z);
        const platform = new THREE.Mesh(new THREE.CylinderGeometry(5, 5.5, 0.5, 24), toon(0x9a9070));
        platform.position.y = 0.25; platform.receiveShadow=true; g.add(platform);
        // Round bench
        const seat = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 2, 8, 8), toon(0xa07848));
        seat.position.set(0, 0.75, -2); seat.rotation.z = Math.PI/2; g.add(seat);
        [-0.8, 0.8].forEach(s => {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.6, 6), toon(0x8b6914));
            leg.position.set(s, 0.45, -2); g.add(leg);
        });
        // Sign
        const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 2, 8), M.trunk);
        sp.position.set(2, 1, 0); g.add(sp);
        const sb = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1, 8, 8), toon(0x654321));
        sb.position.set(2, 2.2, 0); sb.rotation.z = Math.PI/2; g.add(sb);
        // Round rocks
        for (let r=0; r<8; r++) {
            const rock = new THREE.Mesh(new THREE.SphereGeometry(0.25+Math.random()*0.35, 10, 8), M.stone);
            const a = Math.random()*Math.PI*2, d = 3+Math.random()*2;
            rock.position.set(Math.cos(a)*d, 0.2, Math.sin(a)*d);
            rock.scale.y = 0.5+Math.random()*0.3;
            g.add(rock);
        }
        g.position.set(p.x, ty, p.z);
        return g;
    }

    // Maison foret (hobbit-round)
    function mkForestHouse(p) {
        const g = new THREE.Group(), ty = terrH(p.x, p.z);
        // Very round cottage
        const body = new THREE.Mesh(new THREE.SphereGeometry(2, 18, 14, 0, Math.PI*2, 0.2, Math.PI*0.6), toon(0xd2b48c));
        body.position.y = 1.2; body.castShadow=true; g.add(body);
        // Mossy round base
        const base = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.4, 0.4, 18), toon(0x6b7a5a));
        base.position.y = 0.2; g.add(base);
        // Green round roof (mossy dome)
        const roof = new THREE.Mesh(new THREE.SphereGeometry(2.3, 18, 14, 0, Math.PI*2, 0, Math.PI*0.4), toon(0x2d5a1e));
        roof.position.y = 2.6; roof.castShadow=true; g.add(roof);
        // Round door
        const door = new THREE.Mesh(new THREE.CircleGeometry(0.5, 16), M.doorBrown);
        door.position.set(0, 0.8, 1.85); g.add(door);
        // Round windows
        [-0.9, 0.9].forEach(s => {
            const win = new THREE.Mesh(new THREE.CircleGeometry(0.25, 12), toon(0xffdd44));
            win.position.set(s, 1.5, 1.8); g.add(win);
        });
        // Round chimney
        const ch = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 1.2, 8), M.stone);
        ch.position.set(0.8, 3.2, -0.5); ch.castShadow=true; g.add(ch);
        // BD mushrooms (very round!)
        for (let m=0; m<6; m++) {
            const mush = new THREE.Group();
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, 0.3, 8), toon(0xfff8dc));
            stem.position.y = 0.15; mush.add(stem);
            const cap = new THREE.Mesh(new THREE.SphereGeometry(0.18, 10, 8, 0, Math.PI*2, 0, Math.PI*0.55), toon([0xff4444, 0xff8c00, 0x8B4513][m%3]));
            cap.position.y = 0.3; mush.add(cap);
            // Dots on mushroom
            if (m%3===0) {
                for (let d=0; d<3; d++) {
                    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 4), M.white);
                    const da = (d/3)*Math.PI*2;
                    dot.position.set(Math.cos(da)*0.12, 0.33, Math.sin(da)*0.12);
                    mush.add(dot);
                }
            }
            const a = Math.random()*Math.PI*2, d = 2.5+Math.random()*1.5;
            mush.position.set(Math.cos(a)*d, 0, Math.sin(a)*d);
            g.add(mush);
        }
        // Round woodpile
        for (let l=0; l<5; l++) {
            const log = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 1, 6, 6), M.trunk);
            log.position.set(-2.5, 0.12+l*0.16, -0.3+l*0.03);
            log.rotation.z = Math.PI/2;
            g.add(log);
        }
        g.position.set(p.x, ty, p.z); g.rotation.y = 0.8;
        return g;
    }

    // ═══════════════════════════════════════════
    // Build scene
    // ═══════════════════════════════════════════
    const pinCols = { garden:0x27ae60, workshop:0xe67e22, grande_maison:0xe74c3c,
        tipis:0x9b59b6, mere_mitage:0xf39c12, plateau:0x3498db, forest_house:0x1abc9c };
    const interactiveObjects = [];

    KML_PLACES.forEach(p => {
        const pin = mkPin(p.x, p.z, pinCols[p.type]);
        scene.add(pin);
        interactiveObjects.push({ mesh: pin, name: p.name });
        scene.add(mkLabel(p.name, p.x, terrH(p.x,p.z)+7.5, p.z, 0.85, '#2a1a00'));

        switch(p.type) {
            case 'garden': scene.add(mkGarden(p)); break;
            case 'workshop': scene.add(mkWorkshop(p)); break;
            case 'grande_maison': {
                // Move GM closer to center (toward the road/row axis)
                const gmShifted = { ...p, x: p.x - 3, z: p.z - 1 };
                scene.add(mkGrandeMaison(gmShifted));
                break;
            }
            case 'tipis': scene.add(mkTipis(p)); break;
            case 'mere_mitage': scene.add(mkMereMitage(p)); break;
            case 'plateau': scene.add(mkPlateau(p)); break;
            case 'forest_house': scene.add(mkForestHouse(p)); break;
        }
    });

    // ═══════════════════════════════════════════
    // Additional buildings (21 total on property)
    // Chalets, farm buildings, sheds, offices
    // ═══════════════════════════════════════════
    // Building row alignment: AT(9.67,-2.81) → GM(21.74,-17.66) → ME(23.13,-26.33)
    // From aerial: long continuous row of red/brown-roofed farm buildings, N-S along east clearing edge
    function rowPos(t) { // parametric position along building row, t=0→AT, t=1→ME
        return { x: AT.x + (ME.x-AT.x)*t, z: AT.z + (ME.z-AT.z)*t };
    }
    const extraBuildings = [
        // ═══════════════════════════════════════════
        // Long aligned row of buildings on the WEST side of the road
        // Road runs at perpendicular offset -3.5 from row center (AT→ME)
        // All buildings at same perpendicular offset -7 (west of road), aligned along the road
        // GM (shifted closer to center) is on the east side
        // ═══════════════════════════════════════════
        (() => { const p=rowPos(0.05); const px=Math.cos(rowAngle), pz=Math.sin(rowAngle);
            return { x:p.x-px*7, z:p.z+pz*7, opts: { w:5, h:3, d:9, roof:M.roofBrown, wall:toon(0xd0c0a0), rot:rowAngle, chimney:false } }; })(),
        (() => { const p=rowPos(0.18); const px=Math.cos(rowAngle), pz=Math.sin(rowAngle);
            return { x:p.x-px*7, z:p.z+pz*7, opts: { w:5.5, h:3.2, d:10, roof:M.roofRed, wall:toon(0xc8b898), rot:rowAngle, chimney:false } }; })(),
        (() => { const p=rowPos(0.32); const px=Math.cos(rowAngle), pz=Math.sin(rowAngle);
            return { x:p.x-px*7, z:p.z+pz*7, opts: { w:5, h:3, d:9, roof:M.roofBrown, wall:M.wallBeige, rot:rowAngle, chimney:false } }; })(),
        (() => { const p=rowPos(0.46); const px=Math.cos(rowAngle), pz=Math.sin(rowAngle);
            return { x:p.x-px*7, z:p.z+pz*7, opts: { w:5.5, h:3.5, d:11, roof:M.roofRed, wall:toon(0xd0c0a0), rot:rowAngle, chimney:false } }; })(),
        (() => { const p=rowPos(0.60); const px=Math.cos(rowAngle), pz=Math.sin(rowAngle);
            return { x:p.x-px*7, z:p.z+pz*7, opts: { w:5, h:2.8, d:8, roof:toon(0xe8e0d0), wall:M.wall, rot:rowAngle, chimney:false } }; })(),
        (() => { const p=rowPos(0.74); const px=Math.cos(rowAngle), pz=Math.sin(rowAngle);
            return { x:p.x-px*7, z:p.z+pz*7, opts: { w:5.5, h:3.2, d:10, roof:M.roofRed, wall:toon(0xc8b898), rot:rowAngle, chimney:false } }; })(),
        (() => { const p=rowPos(0.88); const px=Math.cos(rowAngle), pz=Math.sin(rowAngle);
            return { x:p.x-px*7, z:p.z+pz*7, opts: { w:5, h:3, d:9, roof:M.roofBrown, wall:toon(0xd8c8a8), rot:rowAngle, chimney:false } }; })(),
        // ── Outlying buildings ──
        // Small outbuilding south of AT
        { x: AT.x+3, z: AT.z+8, opts: { w:3, h:2, d:4, roof:M.roofBrown, wall:toon(0xc8b898), rot:0.1, chimney:false } },
        // Forest house in the woods (west side)
        { x: FCX+6, z: FCZ-4, opts: { w:2.5, h:2.2, d:3, roof:M.roofBrown, wall:toon(0xc8b898), rot:0.6 } },
        // Small building near south meadow
        { x: JA.x+10, z: JA.z-6, opts: { w:3, h:2, d:4, roof:M.roofRed, wall:M.wallBeige, rot:-0.1, chimney:false } },
    ];
    extraBuildings.forEach(b => {
        scene.add(mkHouse(b.x, b.z, b.opts));
    });

    // ═══════════════════════════════════════════
    // Dense forest belt (Forêt de Laigue - aerial view)
    // ═══════════════════════════════════════════
    // Dense forest zone - systematic grid with jitter for natural look
    const forestSpacing = 3.5; // tree spacing in forest
    const allBuildings = KML_PLACES.concat(extraBuildings);
    for (let gx = -72; gx < 72; gx += forestSpacing) {
        for (let gz = -72; gz < 72; gz += forestSpacing) {
            const fx = gx + (Math.random()-0.5)*2.5;
            const fz = gz + (Math.random()-0.5)*2.5;
            if (!isForestZone(fx, fz)) continue;
            // Skip near any building
            let skip = false;
            for (const p of allBuildings) if (Math.sqrt((fx-p.x)**2+(fz-p.z)**2)<4.5) { skip=true; break; }
            if (skip) continue;
            // Old-growth forest: taller trees, mostly deciduous
            const h = 3 + Math.random()*4.5;
            const type = Math.random() > 0.15 ? 'round' : 'pine';
            scene.add(mkTree(fx, fz, h, type));
        }
    }
    // Forest edge trees - extra density along the edge for defined boundary
    for (let i = 0; i < 120; i++) {
        const fx = -70 + Math.random()*140;
        const fz = -70 + Math.random()*140;
        // Only place near forest edge (just inside forest zone)
        if (!isForestZone(fx, fz)) continue;
        if (isForestZone(fx+5, fz) && isForestZone(fx-5, fz) && isForestZone(fx, fz+5) && isForestZone(fx, fz-5)) continue;
        let skip = false;
        for (const p of KML_PLACES) if (Math.sqrt((fx-p.x)**2+(fz-p.z)**2)<4) { skip=true; break; }
        if (skip) continue;
        scene.add(mkTree(fx, fz, 2+Math.random()*3, 'round'));
    }
    // Scattered isolated trees in the south/east meadow (visible as dark spots in aerial)
    // From aerial: a few individual large trees and some dark conifers in the clearing
    const meadowTrees = [
        // South meadow scattered trees (visible in aerial)
        { x: 18, z: 25, h: 4, type: 'round' },
        { x: 25, z: 15, h: 3.5, type: 'pine' },  // dark conifer
        { x: 30, z: 22, h: 4.5, type: 'round' },
        { x: 22, z: 35, h: 3, type: 'pine' },     // dark conifer
        { x: 28, z: 8, h: 4, type: 'round' },
        // Trees east of road
        { x: 32, z: -8, h: 3.5, type: 'round' },
        { x: 35, z: -18, h: 4, type: 'pine' },
        // A few trees in the meadow south of buildings
        { x: 15, z: 12, h: 3.5, type: 'round' },
        { x: 10, z: 20, h: 4, type: 'round' },
        { x: 20, z: 5, h: 3, type: 'round' },
        // Trees near the clearing/forest edge transition
        { x: 8, z: 8, h: 3, type: 'round' },
        { x: 12, z: -8, h: 2.5, type: 'round' },
    ];
    meadowTrees.forEach(t => {
        if (!isForestZone(t.x, t.z)) {
            scene.add(mkTree(t.x, t.z, t.h, t.type));
        }
    });

    // ═══════════════════════════════════════════
    // Paths
    // ═══════════════════════════════════════════
    // ── Main road: runs BETWEEN Grande Maison (east/right) and long building (west/left) ──
    // Matches OSM map layout — road passes through the center of the building area
    // The road is ~3.5 units west of GM, perpendicular to the row direction
    const perpX = Math.cos(rowAngle), perpZ = Math.sin(rowAngle);
    function roadPt(t) { // road follows AT→ME line, offset ~3.5 units west (perpendicular)
        const p = rowPos(t);
        return [p.x - perpX*3.5, p.z + perpZ*3.5];
    }
    // Main road from south to north, passing between the two building rows
    // Wider (3.5) to be clearly visible from above between the buildings
    scene.add(mkPath([
        [roadPt(-0.1)[0]+1, 60],
        [roadPt(-0.1)[0]+1, 45],
        [roadPt(-0.1)[0], JA.z],
        [roadPt(-0.05)[0], AT.z+5],
        roadPt(0),
        roadPt(0.12),
        roadPt(0.25),
        roadPt(0.38),
        roadPt(0.5),
        roadPt(0.63),  // near GM
        roadPt(0.75),
        roadPt(0.88),
        roadPt(1.0),   // near ME
        roadPt(1.1),
    ], 3.5, M.road));
    // Road continues north
    scene.add(mkPath([
        roadPt(1.1),
        roadPt(1.25),
        roadPt(1.4),
        roadPt(1.55),
    ], 3, M.road));
    // ── Curved forest path going WEST from road into forest ──
    scene.add(mkPath([
        roadPt(0.5),
        [roadPt(0.5)[0]-8, roadPt(0.5)[1]+2],
        [roadPt(0.5)[0]-16, roadPt(0.5)[1]+5],
        [FH.x+8, FH.z-4],
        [FH.x+3, FH.z-2],
        [FH.x, FH.z],
        [PL.x+5, PL.z+3],
        [PL.x, PL.z],
    ], 1.3, M.path));
    // Forest path north to tipis (branches from road)
    scene.add(mkPath([
        roadPt(0.9),
        [roadPt(0.9)[0]-5, roadPt(0.9)[1]-5],
        [TI.x+8, TI.z+10],
        [TI.x+4, TI.z+5],
        [TI.x, TI.z],
    ], 1, M.path));
    // Path south toward gardens
    scene.add(mkPath([
        roadPt(0),
        [roadPt(0)[0]-1, AT.z+12],
        [JA.x+5, JA.z-5],
        [JA.x+2, JA.z],
    ], 1.5, M.road));
    // Forest path: tipis to plateau
    scene.add(mkPath([[TI.x,TI.z],[TI.x-4,TI.z+5],[PL.x+4,PL.z-5],[PL.x,PL.z]], 0.8, M.path));

    // Pond (mare) - typical feature in forest clearings
    const px=(FH.x+AT.x)/2-4, pz=(FH.z+AT.z)/2+3;
    const pondGeo = new THREE.CircleGeometry(3.5, 28);
    pondGeo.rotateX(-Math.PI/2);
    const pond = new THREE.Mesh(pondGeo, M.water);
    pond.position.set(px, terrH(px,pz)-0.4, pz);
    pond.scale.set(1.4, 1, 0.9);
    scene.add(pond);
    // Small stream/fossé running south from pond
    scene.add(mkPath([[px, pz], [px+3, pz+8], [px+5, pz+18]], 0.5, M.water));

    // ═══════════════════════════════════════════
    // Agricultural fields (hedgerows visible from aerial)
    // ═══════════════════════════════════════════
    // Field boundary hedgerows (tree rows separating fields)
    const hedgeRows = [
        [[30, -20], [30, 25]], // north-south hedge
        [[42, -15], [42, 30]], // parallel hedge
        [[30, 5], [42, 5]],   // cross hedge
        [[30, -10], [55, -10]], // northern field edge
    ];
    hedgeRows.forEach(pts => {
        const [x1,z1] = pts[0], [x2,z2] = pts[1];
        const len = Math.sqrt((x2-x1)**2+(z2-z1)**2);
        const steps = Math.floor(len / 3);
        for (let i = 0; i <= steps; i++) {
            const t = i / Math.max(steps, 1);
            const hx = x1 + (x2-x1)*t + (Math.random()-0.5)*0.8;
            const hz = z1 + (z2-z1)*t + (Math.random()-0.5)*0.8;
            scene.add(mkBush(hx, hz));
        }
    });
    // Field tracks (visible dirt paths between fields)
    scene.add(mkPath([[30, -20], [30, 25]], 0.6, M.path));
    scene.add(mkPath([[30, 5], [55, 5]], 0.6, M.path));

    // Bushes in clearing (not in forest or fields)
    for (let i=0; i<45; i++) {
        const bx=-10+Math.random()*45, bz=-35+Math.random()*70;
        if (isForestZone(bx, bz) || isFieldZone(bx, bz)) continue;
        let skip=false;
        for (const p of KML_PLACES) if (Math.sqrt((bx-p.x)**2+(bz-p.z)**2)<5) { skip=true; break; }
        if (!skip) scene.add(mkBush(bx, bz));
    }
    // Flowers in clearing meadow
    for (let i=0; i<100; i++) {
        const fx=-10+Math.random()*40, fz=-30+Math.random()*65;
        if (isForestZone(fx, fz) || isFieldZone(fx, fz)) continue;
        scene.add(mkFlower(fx, fz));
    }
    // Wildflowers along forest edge
    for (let i=0; i<40; i++) {
        const fx=-25+Math.random()*50, fz=-45+Math.random()*85;
        if (!isForestZone(fx, fz)) continue;
        // Only near forest edge
        if (isForestZone(fx+4, fz) && isForestZone(fx-4, fz) && isForestZone(fx, fz+4) && isForestZone(fx, fz-4)) continue;
        scene.add(mkFlower(fx, fz));
    }

    // Direction labels (matching real geography)
    scene.add(mkLabel("For\u00eat de Laigue", -45, 15, -15, 1.1, '#2d5a1e'));
    scene.add(mkLabel("\u2193 Autr\u00eaches", AT.x+5, 12, 58, 1.1, '#5a3010'));
    scene.add(mkLabel("Chevillecourt \u2192", 45, 12, -15, 1, '#5a3010'));
    scene.add(mkLabel("\u2190 Compi\u00e8gne", -50, 12, 15, 1, '#5a3010'));
    scene.add(mkLabel("Champs", 40, 12, 10, 0.85, '#8a7a40'));

    // ═══════════════════════════════════════════
    // Clouds (very round, BD style)
    // ═══════════════════════════════════════════
    const clouds = [];
    for (let i=0; i<8; i++) {
        const cg = new THREE.Group();
        const n = 5+Math.floor(Math.random()*3);
        for (let j=0; j<n; j++) {
            const r = 1.8+Math.random()*2.2;
            const sp = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), M.white);
            sp.position.set((Math.random()-0.5)*4, (Math.random()-0.5)*0.6, (Math.random()-0.5)*2);
            sp.scale.y = 0.45;
            cg.add(sp);
        }
        cg.position.set(-60+Math.random()*120, 28+Math.random()*15, -50+Math.random()*80);
        clouds.push(cg); scene.add(cg);
    }

    // ═══════════════════════════════════════════
    // Tooltip
    // ═══════════════════════════════════════════
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tooltipEl = document.getElementById('tooltip');
    renderer.domElement.addEventListener('mousemove', e => {
        mouse.x = (e.clientX/innerWidth)*2-1;
        mouse.y = -(e.clientY/innerHeight)*2+1;
        raycaster.setFromCamera(mouse, camera);
        let found = false;
        for (const obj of interactiveObjects) {
            if (raycaster.intersectObjects(obj.mesh.children, true).length > 0) {
                tooltipEl.style.display = 'block';
                tooltipEl.style.left = (e.clientX+15)+'px';
                tooltipEl.style.top = (e.clientY-10)+'px';
                tooltipEl.textContent = obj.name;
                found = true; break;
            }
        }
        if (!found) tooltipEl.style.display = 'none';
    });

    // ═══════════════════════════════════════════
    // Panoramax street-level images
    // ═══════════════════════════════════════════
    const PANORAMAX_API = 'https://api.panoramax.xyz/api';
    const PANORAMAX_BBOX = [3.125, 49.434, 3.132, 49.440]; // around L'Hermitage
    const photoGroup = new THREE.Group();
    photoGroup.visible = false;
    scene.add(photoGroup);

    const photoObjects = []; // for raycasting
    let panoramaxLoaded = false;

    // Create a photo panel billboard in the 3D scene
    function mkPhotoPanel(imageUrl, thumbUrl, worldX, worldZ, heading, caption) {
        const g = new THREE.Group();
        const ty = terrH(worldX, worldZ);

        // Pole
        const pole = new THREE.Mesh(
            new THREE.CylinderGeometry(0.06, 0.06, 4, 8),
            toon(0x666666)
        );
        pole.position.y = 2;
        g.add(pole);

        // Photo frame (initially white, texture loaded async)
        const pw = 2.8, ph = 2;
        const frameMat = new THREE.MeshToonMaterial({
            color: 0xffffff, gradientMap: toonTex, side: THREE.DoubleSide
        });
        const frame = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), frameMat);
        frame.position.y = 4.5;
        frame.castShadow = true;
        g.add(frame);

        // Load thumbnail texture
        const loader = new THREE.TextureLoader();
        loader.crossOrigin = 'anonymous';
        loader.load(thumbUrl, (tex) => {
            tex.colorSpace = THREE.SRGBColorSpace;
            frameMat.map = tex;
            frameMat.needsUpdate = true;
        });

        // BD-style white border frame
        const border = new THREE.Mesh(
            new THREE.PlaneGeometry(pw + 0.3, ph + 0.3),
            new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: toonTex, side: THREE.DoubleSide })
        );
        border.position.y = 4.5;
        border.position.z = -0.02;
        g.add(border);

        // Dark outline border
        const outline = new THREE.Mesh(
            new THREE.PlaneGeometry(pw + 0.45, ph + 0.45),
            new THREE.MeshToonMaterial({ color: 0x2a1a00, gradientMap: toonTex, side: THREE.DoubleSide })
        );
        outline.position.y = 4.5;
        outline.position.z = -0.04;
        g.add(outline);

        // Panoramax icon dot at top
        const dot = new THREE.Mesh(
            new THREE.SphereGeometry(0.22, 12, 8),
            toon(0x3498db)
        );
        dot.position.y = 5.7;
        g.add(dot);

        g.position.set(worldX, ty, worldZ);

        // Store metadata
        g.userData = { imageUrl, caption, frame };

        return g;
    }

    // Fetch and display Panoramax images
    async function loadPanoramaxImages() {
        const statusEl = document.getElementById('panoramax-status');
        statusEl.style.display = 'block';
        statusEl.textContent = 'Chargement des photos...';

        try {
            const bbox = PANORAMAX_BBOX.join(',');
            const url = `${PANORAMAX_API}/search?bbox=${bbox}&limit=50`;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`API ${resp.status}`);
            const data = await resp.json();

            if (!data.features || data.features.length === 0) {
                statusEl.textContent = 'Aucune photo trouv\u00e9e dans cette zone';
                setTimeout(() => statusEl.style.display = 'none', 3000);
                return;
            }

            // Deduplicate: keep one image per ~15m grid cell to avoid clutter
            const gridSize = 0.00015; // ~15m in degrees
            const seen = new Set();
            const filtered = [];
            for (const f of data.features) {
                const [lon, lat] = f.geometry.coordinates;
                const key = `${Math.round(lon/gridSize)}_${Math.round(lat/gridSize)}`;
                if (!seen.has(key)) {
                    seen.add(key);
                    filtered.push(f);
                }
            }

            let count = 0;
            for (const feature of filtered) {
                const [lon, lat] = feature.geometry.coordinates;
                const { x: wx, z: wz } = gps(lon, lat);

                // Skip if too far from scene center
                if (Math.abs(wx) > 70 || Math.abs(wz) > 70) continue;

                const id = feature.id;
                const thumbUrl = feature.assets?.thumb?.href
                    || feature.assets?.sd?.href
                    || `${PANORAMAX_API}/pictures/${id}/thumb.jpg`;
                const hdUrl = feature.assets?.hd?.href
                    || feature.assets?.sd?.href
                    || `${PANORAMAX_API}/pictures/${id}/sd.jpg`;

                const heading = feature.properties?.['view:azimuth'] || 0;
                const date = feature.properties?.datetime
                    ? new Date(feature.properties.datetime).toLocaleDateString('fr-FR')
                    : '';
                const caption = date ? `Panoramax - ${date}` : 'Panoramax';

                const panel = mkPhotoPanel(hdUrl, thumbUrl, wx, wz, heading, caption);
                photoGroup.add(panel);
                photoObjects.push(panel);
                count++;
            }

            statusEl.textContent = `${count} photo${count > 1 ? 's' : ''} charg\u00e9e${count > 1 ? 's' : ''}`;
            panoramaxLoaded = true;
            setTimeout(() => statusEl.style.display = 'none', 3000);
        } catch (err) {
            console.error('Panoramax error:', err);
            statusEl.textContent = 'Erreur de chargement des photos';
            setTimeout(() => statusEl.style.display = 'none', 4000);
        }
    }

    // Toggle button
    const panoramaxBtn = document.getElementById('panoramax-btn');
    panoramaxBtn.addEventListener('click', () => {
        if (!panoramaxLoaded) {
            loadPanoramaxImages().then(() => {
                photoGroup.visible = true;
                panoramaxBtn.classList.add('active');
            });
        } else {
            photoGroup.visible = !photoGroup.visible;
            panoramaxBtn.classList.toggle('active');
        }
    });

    // Click on photo panels to open full view
    renderer.domElement.addEventListener('click', (e) => {
        if (!photoGroup.visible || photoObjects.length === 0) return;
        const m = new THREE.Vector2(
            (e.clientX / innerWidth) * 2 - 1,
            -(e.clientY / innerHeight) * 2 + 1
        );
        const rc = new THREE.Raycaster();
        rc.setFromCamera(m, camera);

        for (const panel of photoObjects) {
            const hits = rc.intersectObjects(panel.children, true);
            if (hits.length > 0) {
                const viewer = document.getElementById('photo-viewer');
                const img = document.getElementById('photo-viewer-img');
                const cap = document.getElementById('photo-viewer-caption');
                img.src = panel.userData.imageUrl;
                cap.textContent = panel.userData.caption;
                viewer.style.display = 'flex';
                break;
            }
        }
    });

    // Make photo panels always face the camera (billboard)
    function updatePhotoPanels() {
        if (!photoGroup.visible) return;
        for (const panel of photoObjects) {
            panel.lookAt(camera.position.x, panel.position.y, camera.position.z);
        }
    }

    // ═══════════════════════════════════════════
    // Animation
    // ═══════════════════════════════════════════
    document.getElementById('loading').style.display = 'none';
    let time = 0;

    function animate() {
        requestAnimationFrame(animate);
        time += 0.005;
        clouds.forEach((c,i) => { c.position.x += 0.008+i*0.002; if (c.position.x>70) c.position.x=-70; });
        pond.material.opacity = 0.85 + Math.sin(time*3)*0.05;
        interactiveObjects.forEach((o,i) => {
            const h = o.mesh.children[1];
            if (h) h.position.y = 3.4 + Math.sin(time*2+i)*0.18;
        });
        updatePhotoPanels();
        controls.update();
        composer.render();
    }
    animate();

    addEventListener('resize', () => {
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        composer.setSize(innerWidth, innerHeight);
        outlinePass.uniforms.resolution.value.set(innerWidth, innerHeight);
    });

    </script>
</body>
</html>
